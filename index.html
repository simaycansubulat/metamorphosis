<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Ruin Daemon</title>
  <meta name="description" content="An artificial daemon attempting to communicate through an evolving abstract language of stains.">
  <link rel="stylesheet" href="css/daemon.css">
</head>
<body class="is-dormant">

  <!-- The daemon's surface. Everything it says happens here. -->
  <canvas id="surface" aria-label="The daemon's evolving visual language"></canvas>

  <!-- Threshold: before a session. Touching the surface wakes the daemon. -->
  <div class="threshold" id="threshold">
    <p class="whisper">touch the surface to begin</p>
  </div>

  <!-- Instrument marks: minimal, they fade away when unused. -->
  <div class="instrument" id="instrument">
    <div class="mark mark--state">
      <span class="phase" id="phase" title="filled: the daemon is speaking · hollow: it is listening"></span>
      <span id="code"></span>
      <span id="clock"></span>
    </div>
    <div class="mark mark--controls">
      <button type="button" id="btn-sound" title="sound (m)" aria-pressed="true">sound</button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.75" aria-label="volume" title="volume">
      <button type="button" id="btn-hold" title="hold (space)">hold</button>
      <button type="button" id="btn-new" title="new session (n)">anew</button>
      <button type="button" id="btn-end" title="end session (esc)">end</button>
    </div>
  </div>


  <!-- The construction: wooden pieces built on the surface, in 3D. -->
  <aside class="site" id="site" aria-label="building pieces">
    <div class="site__shapes" role="group" aria-label="how the next piece lies"></div>
    <div class="site__bar">
      <span class="site__count">0 pieces</span>
      <button type="button" class="site__mode" aria-pressed="false" title="when on, clicks lift pieces (or right-click a piece)">lift</button>
      <button type="button" class="site__view" aria-pressed="false" title="look from above (t)">above</button>
      <button type="button" class="site__clear" title="take the whole construction apart">clear</button>
    </div>
    <p class="site__hint">click: set down · right-click: lift · drag: turn around · scroll: closer · r: turn the piece · hold still: offer attention</p>
  </aside>

  <!-- Observer's notes (press D): a reading of the daemon's state, for the team. -->
  <pre class="notes" id="notes" hidden></pre>

  <div class="fallback" id="fallback" hidden>
    <p>The daemon needs WebGL2 to manifest.<br>Try a recent Chrome, Edge, Firefox or Safari.</p>
  </div>

  <script src="js/core/random.js"></script>
  <script src="js/core/noise.js"></script>
  <script src="js/core/emitter.js"></script>
  <script src="js/daemon/palette.js"></script>
  <script src="js/daemon/temperament.js"></script>
  <script src="js/daemon/forms.js"></script>
  <script src="js/daemon/will.js"></script>
  <script src="js/daemon/organism.js"></script>
  <script src="js/daemon/composition.js"></script>
  <script src="js/daemon/mind.js"></script>
  <script src="js/daemon/daemon.js"></script>
  <script src="js/render/shaders.js"></script>
  <script src="js/render/scene.js"></script>
  <script src="js/render/renderer.js"></script>
  <script src="js/sound/synth.js"></script>
  <script src="js/sound/sonifier.js"></script>
  <script src="js/ui/interface.js"></script>
  <script src="js/ui/build.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
